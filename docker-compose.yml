services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333"]

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
      # Only needed for run_tests: lets the API start sandbox containers.
      # Remove this line to disable test execution entirely.
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["8000:8000"]
    depends_on: [qdrant]

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      DEVAGENT_API: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

  # Build-only service for the offline pytest sandbox image used by run_tests.
  sandbox:
    build: ./sandbox
    image: devagent-sandbox:latest
    profiles: ["build-only"]

volumes:
  qdrant_data:
  app_data:
